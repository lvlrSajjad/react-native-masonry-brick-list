name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # --legacy-peer-deps skips resolving the root peerDependencies. They are
      # a declaration for consumers, not something the tests need: react-native
      # is mocked (see test-utils/react-native-mock.js), and installing it here
      # would drag in whichever React version the newest RN happens to peer on.
      - run: npm install --legacy-peer-deps
      - run: npm test
